name: Find latest misuse

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      hint:
        description: "Optional: what to look for (leave empty for whatever is newest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: find-misuse
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ask Claude for new entries
        id: find
        run: node scripts/find-misuse.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HINT: ${{ inputs.hint }}

      - name: Check the data
        if: steps.find.outputs.count != '0'
        run: node scripts/validate.mjs

      - name: Open a pull request for review
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.find.outputs.title }}
        run: |
          branch="misuse/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/entries.json
          git commit -m "$TITLE"
          git push origin "$branch"
          gh label create misuse-candidate --color C8102E --description "Found by the daily search, waiting for a human" --force
          gh pr create --base main --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md" --label misuse-candidate
